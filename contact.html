<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>North Star Bakery — Contact</title>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="logo" href="index.html">North Star Bakery</a>
      <nav class="main-nav" aria-label="Primary">
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="about.html">About</a></li>
          <li><a href="menu.html">Menu</a></li>
          <li><a href="contact.html" aria-current="page">Contact</a></li>
        </ul>
      </nav>
    </div>
  </header>
  <main class="container">
    <section class="contact-intro">
      <h1>Contact Us</h1>
      <p class="lead">Questions, orders, or pickup details — send us a message.</p>
    </section>
    <section class="contact-form">
      <p id="form-success" class="form-success" aria-live="polite"></p>
      <form action="#" method="post" novalidate>
        <label for="name">Name</label>
        <input id="name" name="name" type="text" required />
        <span id="name-error" class="field-error" role="alert"></span>

        <label for="email">Email</label>
        <input id="email" name="email" type="email" required />
        <span id="email-error" class="field-error" role="alert"></span>

        <label for="message">Message</label>
        <textarea id="message" name="message" rows="5" required></textarea>
        <span id="message-error" class="field-error" role="alert"></span>

        <button class="btn-primary" type="submit">Send Message</button>
      </form>
    </section>
  </main>
  <footer class="site-footer">
    <div class="container footer-inner">
      <p>&copy; 2024 North Star Bakery</p>
    </div>
  </footer>
  <script src="script.js" defer></script>
</body>
</html>
